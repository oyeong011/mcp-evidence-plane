name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  policy-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Test with no dependencies installed
        run: npm test
      - name: Prove the tree really has no runtime dependencies
        run: |
          test ! -d node_modules
          node -e 'const p=require("./package.json"); if (p.dependencies && Object.keys(p.dependencies).length) { console.error("runtime dependencies present"); process.exit(1) }'
